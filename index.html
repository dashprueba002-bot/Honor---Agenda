<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel · HONOR Formularios QR</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="/assets/form-render.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><img src="/assets/logo-honor.png" alt="HONOR Servicios de Seguridad"></div>
  <span class="who"><span id="who"></span><button class="btn quiet small" data-act="logout" style="margin-left:8px">Cerrar sesión</button></span>
</header>
<div id="app"><div class="shell"><aside id="side"></aside><main id="main"><div class="loading">Cargando formularios…</div></main></div></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const { TYPES, CHOICE, esc, renderForm, collect } = window.QRForms;
const PALETTE = ["#013FA4","#3DA218","#7FA6E8","#E8A317","#5E6E8C","#9BD37F","#0A2A6B","#C2575A","#2E7D8C","#B7C3D9"];

const S = {
  forms: [], loaded: false, selected: null, draft: null, saved: null, dirty: false, saving: false,
  tab: "design", responses: {}, loadingResp: false
};
let charts = [], chartSpecs = [], refreshTimer = null;

const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const newId = () => "q" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtDate = iso => { try { return new Date(iso).toLocaleString("es-CO",{dateStyle:"medium",timeStyle:"short"}); } catch { return iso; } };
const num = n => Number(n).toLocaleString("es-CO",{maximumFractionDigits:1});
const slug = s => (s||"formulario").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase() || "formulario";

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2800);
}

async function api(path, opts = {}){
  const r = await fetch("/api/manage/" + path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (r.status === 401){ location.replace("/"); throw new Error("Tu sesión terminó. Vuelve a ingresar."); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
  return data;
}

/* ---------- Carga ---------- */
async function init(){
  try {
    const r = await fetch("/api/me");
    if (!r.ok){ location.replace("/"); return; }
    const d = await r.json();
    $("#who").innerHTML = `Administrador <b>${esc(d.user)}</b>`;
  } catch { location.replace("/"); return; }
  await loadForms();
}
async function logout(){
  try { await fetch("/api/logout", { method:"POST", headers:{ "Content-Type":"application/json" } }); } catch {}
  location.replace("/");
}

async function loadForms(){
  try {
    const { forms } = await api("forms");
    S.forms = forms; S.loaded = true;
    if (S.selected && !S.dirty){
      const f = forms.find(x => x.id === S.selected);
      if (f){ S.draft = clone(f); S.saved = clone(f); }
    }
    if (!S.selected && !S.draft && forms.length) selectForm(forms[0].id, true);
    renderSidebar(); renderMain();
  } catch (e){
    S.loaded = true;
    $("#main").innerHTML = `<div class="empty"><h2>No se pudo conectar con SharePoint</h2><p>${esc(e.message)}</p><p>Revisa en Netlify las variables TENANT_ID, CLIENT_ID, CLIENT_SECRET y SITE_ID, y que la aplicación registrada en Microsoft tenga permiso sobre el sitio de SharePoint.</p><button class="btn" data-act="reload">Reintentar</button></div>`;
  }
}

function selectForm(id, silent){
  const f = S.forms.find(x => x.id === id); if (!f) return;
  S.selected = id; S.draft = clone(f); S.saved = clone(f); S.dirty = false;
  if (!silent){ renderSidebar(); renderMain(); }
}

/* ---------- Barra lateral ---------- */
function renderSidebar(){
  const side = $("#side");
  const list = S.forms.map(f => {
    const n = S.responses[f.id] ? `, ${S.responses[f.id].list.length} respuestas` : "";
    return `<button class="fitem" data-act="select" data-id="${esc(f.id)}" aria-current="${f.id === S.selected}">
      <b>${esc(f.title)}${f.active ? "" : `<span class="pill off">Cerrado</span>`}</b><small>${f.fields.length} preguntas${n}</small></button>`;
  }).join("");
  const draftItem = S.draft && !S.draft.id ? `<button class="fitem" aria-current="true"><b>${esc(S.draft.title || "Formulario sin título")}</b><small>Sin publicar</small></button>` : "";
  side.innerHTML = `<button class="btn primary block" data-act="new">Nuevo formulario</button>
    <nav class="flist" aria-label="Formularios">${draftItem}${list || (draftItem ? "" : `<small style="color:var(--muted);padding:8px 4px">${S.loaded ? "Aún no hay formularios." : "Cargando…"}</small>`)}</nav>`;
}

/* ---------- Panel principal ---------- */
function destroyCharts(){ charts.forEach(c => { try { c.destroy(); } catch {} }); charts = []; }

function renderMain(){
  const main = $("#main");
  destroyCharts();
  clearInterval(refreshTimer);
  if (!S.loaded){ main.innerHTML = `<div class="loading">Cargando formularios…</div>`; return; }
  if (!S.draft){
    main.innerHTML = `<div class="empty"><h2>Crea tu primer formulario</h2><p>Diseña las preguntas, publícalo y descarga su código QR. Cualquier persona que lo escanee podrá responder sin cuenta, y cada respuesta quedará en una lista de SharePoint.</p><button class="btn primary" data-act="new">Nuevo formulario</button></div>`;
    return;
  }
  const d = S.draft, published = !!d.id;
  const tabs = [["design","Diseñar"],["share","QR y SharePoint"],["stats","Indicadores"]];
  main.innerHTML = `
    <div class="fhead"><h1 id="ftitle">${esc(d.title || "Formulario sin título")}</h1>
      <div class="row"><button class="btn small" data-act="preview">Vista previa</button></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k,l]) => `<button class="tab" role="tab" data-act="tab" data-tab="${k}" aria-selected="${S.tab===k}" ${!published && k!=="design" ? "disabled" : ""}>${l}</button>`).join("")}</div>
    <section id="panel">${S.tab==="design" || !published ? designHTML(d) : S.tab==="share" ? shareHTML(d) : statsHTML(d)}</section>`;
  if (S.tab === "stats" && published){
    mountCharts();
    refreshTimer = setInterval(() => loadResponses(d.id, true), 60000);
  }
}

function designHTML(d){
  const savedIds = new Set((S.saved && S.saved.id ? S.saved.fields : []).map(q => q.id));
  return `<div class="editor">
    <label class="fld"><span>Título del formulario</span><input class="in" data-k="title" value="${esc(d.title)}" maxlength="200"></label>
    <label class="fld"><span>Descripción o instrucciones</span><textarea class="in" data-k="description" maxlength="2000" placeholder="Ej.: Completa esta inspección al terminar cada turno.">${esc(d.description)}</textarea></label>
    <ol class="qs">
      ${d.fields.map((q,i) => {
        const locked = savedIds.has(q.id);
        return `<li class="q" data-i="${i}">
        <div class="q-head"><span class="q-n">${i+1}</span><input class="in q-label" data-f="label" value="${esc(q.label)}" maxlength="240" placeholder="Escribe la pregunta" aria-label="Pregunta ${i+1}"></div>
        <div class="q-row">
          <select class="in" data-f="type" aria-label="Tipo de respuesta" ${locked ? "disabled" : ""}>${TYPES.map(t => `<option value="${t.v}" ${t.v===q.type?"selected":""}>${t.l}</option>`).join("")}</select>
          <label class="chk"><input type="checkbox" data-f="required" ${q.required?"checked":""}> Obligatoria</label>
          <div class="q-tools">
            <button class="btn quiet small" data-act="up" aria-label="Subir pregunta" ${i===0?"disabled":""}>↑</button>
            <button class="btn quiet small" data-act="down" aria-label="Bajar pregunta" ${i===d.fields.length-1?"disabled":""}>↓</button>
            <button class="btn quiet small danger" data-act="delq">Eliminar</button>
          </div>
        </div>
        ${locked ? `<div class="lock" style="margin:6px 0 0 40px">El tipo queda fijo porque ya es una columna en SharePoint. Para cambiarlo, crea una pregunta nueva.</div>` : ""}
        ${CHOICE.includes(q.type) ? `<label class="fld"><span>Opciones, una por línea</span><textarea class="in" data-f="options">${esc((q.options||[]).join("\n"))}</textarea></label>` : ""}
      </li>`;}).join("")}
    </ol>
    <button class="btn" data-act="addq">Agregar pregunta</button>
    <div class="savebar"><span class="state ${S.dirty?"warn":""}" id="savestate">${!d.id ? "Sin publicar" : S.dirty ? "Cambios sin guardar" : "Todo guardado"}</span>
      <button class="btn primary" data-act="save" ${S.saving?"disabled":""}>${d.id ? "Guardar cambios" : "Publicar formulario"}</button></div>
    ${d.id ? `<p style="margin-top:28px"><button class="btn quiet small ${d.active?"danger":""}" data-act="toggle">${d.active ? "Cerrar formulario (deja de recibir respuestas)" : "Reabrir formulario"}</button></p>` : ""}
  </div>`;
}

function formLink(d){ return d.id ? `${location.origin}/f/?id=${encodeURIComponent(d.id)}&k=${encodeURIComponent(d.key)}` : ""; }

function qrMatrix(text){
  if (typeof qrcode === "undefined") return null;
  const qr = qrcode(0, "M"); qr.addData(text); qr.make(); return qr;
}
function qrSvg(text){
  const qr = qrMatrix(text);
  if (!qr) return `<p>No se pudo cargar el generador de QR.</p>`;
  const n = qr.getModuleCount(); let p = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r,c)) p += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="Código QR del formulario"><rect width="${n}" height="${n}" fill="#fff"/><path d="${p}" fill="#0F1B33"/></svg>`;
}

function shareHTML(d){
  const link = formLink(d);
  return `<div class="share">
    <div>
      <div class="placard">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <img class="placard-logo" src="/assets/logo-honor.png" alt="HONOR Servicios de Seguridad">
        <div class="qr">${qrSvg(link)}</div>
        <div class="placard-title">${esc(d.title)}</div>
        <div class="placard-sub">Escanea para responder</div>
      </div>
      <div class="row" style="margin-top:14px"><button class="btn primary" data-act="dlqr">Descargar QR</button><a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Abrir formulario</a></div>
      ${d.active ? "" : `<div class="note">Este formulario está cerrado: el QR muestra un aviso y no acepta respuestas.</div>`}
    </div>
    <div>
      <h3>Enlace público</h3>
      <p>Cualquier persona con este enlace o el QR puede responder desde su celular, sin usuario ni contraseña.</p>
      <div class="row"><input class="in" readonly value="${esc(link)}" id="linkbox"><button class="btn" data-act="copy">Copiar enlace</button></div>

      <h3>Lista de SharePoint</h3>
      <p>Cada respuesta se guarda al instante como un elemento de esta lista, con una columna por pregunta. Desde ahí puedes filtrar, exportar a Excel, conectar Power BI o crear flujos.</p>
      <div class="row">
        ${d.listUrl ? `<a class="btn primary" href="${esc(d.listUrl)}" target="_blank" rel="noopener">Abrir lista en SharePoint</a>` : ""}
        <button class="btn" data-act="csv">Exportar CSV</button>
      </div>
      <ol class="steps">
        <li>Imprime el QR y pégalo donde se diligencia el formulario, o compártelo por correo o WhatsApp.</li>
        <li>Para publicarlo en una página de SharePoint, usa el elemento web “Imagen” con el QR descargado y enlázalo a la dirección pública.</li>
        <li>Si agregas preguntas después, se crean como columnas nuevas en la misma lista; las respuestas anteriores no se pierden.</li>
      </ol>
    </div>
  </div>`;
}

/* ---------- Indicadores ---------- */
async function loadResponses(id, quiet){
  if (S.loadingResp) return;
  S.loadingResp = true;
  try {
    const { responses } = await api(`responses/${encodeURIComponent(id)}`);
    S.responses[id] = { list: responses, at: new Date() };
    renderSidebar();
    if (S.tab === "stats" && S.draft && S.draft.id === id) renderMain();
  } catch (e){ if (!quiet) toast(e.message); }
  finally { S.loadingResp = false; }
}

function statsHTML(d){
  chartSpecs = [];
  const cache = S.responses[d.id];
  if (!cache){ loadResponses(d.id); return `<div class="loading">Leyendo respuestas desde SharePoint…</div>`; }
  const rs = cache.list;
  const refresh = `<div class="row" style="justify-content:space-between;margin-bottom:14px"><span class="lock">Actualizado ${esc(cache.at.toLocaleTimeString("es-CO",{timeStyle:"short"}))}, se refresca cada minuto</span><button class="btn small" data-act="refresh">Actualizar ahora</button></div>`;
  if (!rs.length) return refresh + `<div class="empty"><h2>Aún no hay respuestas</h2><p>Comparte el código QR y los indicadores aparecerán aquí a medida que lleguen las respuestas.</p><button class="btn primary" data-act="tab" data-tab="share">Ver el QR</button></div>`;
  const now = new Date(), today = dayKey(now);
  const nToday = rs.filter(r => dayKey(new Date(r.at)) === today).length;
  const n7 = rs.filter(r => now - new Date(r.at) < 7*864e5).length;
  const last = rs[rs.length-1];
  const days = []; for (let i = 13; i >= 0; i--){ const x = new Date(now); x.setDate(x.getDate()-i); days.push(x); }
  chartSpecs.push({kind:"line", labels:days.map(x => x.toLocaleDateString("es-CO",{day:"numeric",month:"short"})), data:days.map(x => rs.filter(r => dayKey(new Date(r.at)) === dayKey(x)).length)});
  const recent = rs.slice(-8).reverse(), cols = d.fields.slice(0,4);
  return refresh + `
    <div class="kpis">
      <div class="kpi"><b>${rs.length}</b><span>Respuestas totales</span></div>
      <div class="kpi"><b>${nToday}</b><span>Hoy</span></div>
      <div class="kpi"><b>${n7}</b><span>Últimos 7 días</span></div>
      <div class="kpi"><b class="sm">${esc(fmtDate(last.at))}</b><span>Última respuesta</span></div>
    </div>
    <div class="grid">
      <div class="card wide"><h4>Respuestas por día</h4><div class="meta">Últimos 14 días</div><div class="chartbox"><canvas data-c="0"></canvas></div></div>
      ${d.fields.map(q => fieldCard(q, rs)).join("")}
      <div class="card wide"><h4>Últimas respuestas</h4><div class="meta">Las 8 más recientes</div>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>Fecha</th>${cols.map(c => `<th>${esc(c.label)}</th>`).join("")}</tr></thead>
        <tbody>${recent.map(r => `<tr><td>${esc(fmtDate(r.at))}</td>${cols.map(c => `<td>${esc(show(r.answers[c.id]))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      </div>
    </div>`;
}
function show(v){ return Array.isArray(v) ? v.join(", ") : (v ?? "—"); }

function fieldCard(q, rs){
  const vals = rs.map(r => r.answers[q.id]).filter(v => !(v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length)));
  const head = `<h4>${esc(q.label)}</h4><div class="meta">${vals.length} de ${rs.length} respondieron</div>`;
  if (!vals.length) return `<div class="card">${head}<p style="color:var(--muted);margin:0">Sin datos todavía.</p></div>`;
  const add = spec => { chartSpecs.push(spec); return `<div class="chartbox"><canvas data-c="${chartSpecs.length-1}"></canvas></div>`; };
  if (["radio","select","yesno","checkbox"].includes(q.type)){
    const opts = q.type === "yesno" ? ["Sí","No"] : [...(q.options||[])];
    const flat = q.type === "checkbox" ? vals.flat() : vals;
    flat.forEach(v => { if (!opts.includes(v)) opts.push(v); });
    const counts = opts.map(o => flat.filter(v => v === o).length);
    const top = Math.max(...counts), ti = counts.indexOf(top);
    const kind = (q.type !== "checkbox" && opts.length <= 4) ? "doughnut" : "hbar";
    return `<div class="card">${head}<p style="margin:0 0 8px"><b>${esc(opts[ti])}</b> lidera con ${top} (${Math.round(top/vals.length*100)}%)</p>${add({kind, labels:opts, data:counts})}</div>`;
  }
  if (q.type === "rating"){
    const ns = vals.map(Number), avg = ns.reduce((a,b) => a+b, 0) / ns.length;
    const counts = [1,2,3,4,5].map(k => ns.filter(v => v === k).length);
    return `<div class="card">${head}<div class="stats"><div><span>Promedio</span><div class="big">${num(avg)} <small style="font-size:16px;color:var(--muted)">de 5</small></div></div>
      <div><span>Satisfechos (4 o 5)</span><div class="big">${Math.round((counts[3]+counts[4])/ns.length*100)}%</div></div></div>${add({kind:"rating", labels:["1","2","3","4","5"], data:counts})}</div>`;
  }
  if (q.type === "number"){
    const ns = vals.map(Number).filter(n => !isNaN(n)), avg = ns.reduce((a,b) => a+b, 0) / (ns.length || 1);
    return `<div class="card">${head}<div class="stats"><div><span>Promedio</span><div class="big">${num(avg)}</div></div><div><span>Mínimo</span><div class="big">${num(Math.min(...ns))}</div></div><div><span>Máximo</span><div class="big">${num(Math.max(...ns))}</div></div></div>${add({kind:"line", labels:ns.map((_,i) => String(i+1)), data:ns})}</div>`;
  }
  if (q.type === "date"){
    const m = {}; vals.forEach(v => { const k = String(v).slice(0,7); m[k] = (m[k]||0)+1; });
    const keys = Object.keys(m).sort();
    return `<div class="card">${head}${add({kind:"bar", labels:keys.map(k => { const [y,mo] = k.split("-"); return new Date(+y, +mo-1, 1).toLocaleDateString("es-CO",{month:"short",year:"2-digit"}); }), data:keys.map(k => m[k])})}</div>`;
  }
  return `<div class="card">${head}<ul class="quotes">${vals.slice(-4).reverse().map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>`;
}

function mountCharts(){
  if (typeof Chart === "undefined") return;
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  const muted = v("--muted"), line = v("--line"), accent = v("--accent"), surface = v("--surface"), soft = v("--accent-soft"), signal = v("--signal");
  Chart.defaults.font.family = '"Archivo","Segoe UI",system-ui,sans-serif';
  Chart.defaults.color = muted;
  const axes = h => ({ x:{grid:{color:h?line:"transparent"},ticks:{color:muted,precision:0},beginAtZero:true}, y:{grid:{color:h?"transparent":line},ticks:{color:muted,precision:0},beginAtZero:true} });
  document.querySelectorAll("canvas[data-c]").forEach(cv => {
    const s = chartSpecs[+cv.dataset.c]; if (!s) return;
    const base = {responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, animation:{duration:350}};
    let cfg;
    if (s.kind === "doughnut") cfg = {type:"doughnut", data:{labels:s.labels, datasets:[{data:s.data, backgroundColor:PALETTE, borderColor:surface, borderWidth:3}]}, options:{...base, cutout:"60%", plugins:{legend:{display:true, position:"right", labels:{color:muted, boxWidth:12, boxHeight:12}}}}};
    else if (s.kind === "hbar") cfg = {type:"bar", data:{labels:s.labels, datasets:[{data:s.data, backgroundColor:accent, borderRadius:4, maxBarThickness:30}]}, options:{...base, indexAxis:"y", scales:axes(true)}};
    else if (s.kind === "rating") cfg = {type:"bar", data:{labels:s.labels, datasets:[{data:s.data, backgroundColor:s.labels.map((_,i) => i >= 3 ? accent : "#9DB3DC"), borderRadius:4, maxBarThickness:36}]}, options:{...base, scales:axes(false)}};
    else if (s.kind === "bar") cfg = {type:"bar", data:{labels:s.labels, datasets:[{data:s.data, backgroundColor:accent, borderRadius:4, maxBarThickness:36}]}, options:{...base, scales:axes(false)}};
    else cfg = {type:"line", data:{labels:s.labels, datasets:[{data:s.data, borderColor:accent, backgroundColor:soft, fill:true, tension:.3, pointRadius:3, pointBackgroundColor:accent}]}, options:{...base, scales:axes(false)}};
    charts.push(new Chart(cv, cfg));
  });
}

/* ---------- Acciones ---------- */
function markDirty(){
  S.dirty = true;
  const el = $("#savestate"); if (el && S.draft.id){ el.textContent = "Cambios sin guardar"; el.classList.add("warn"); }
}
function confirmDiscard(){ return !(S.dirty || (S.draft && !S.draft.id)) || confirm("Tienes cambios sin guardar. ¿Descartarlos?"); }

function newForm(){
  if (!confirmDiscard()) return;
  S.selected = null; S.saved = null; S.dirty = false; S.tab = "design";
  S.draft = { id:null, title:"Formulario sin título", description:"", active:true, fields:[
    {id:newId(), label:"Nombre del guarda", type:"text", required:true, options:[]},
    {id:newId(), label:"Puesto", type:"select", required:true, options:["Portería principal","Parqueadero","Recepción","Ronda perimetral"]},
    {id:newId(), label:"¿Se encontraron novedades?", type:"yesno", required:true, options:[]},
    {id:newId(), label:"Describe la novedad", type:"textarea", required:false, options:[]},
    {id:newId(), label:"Calificación del puesto", type:"rating", required:true, options:[]}
  ]};
  renderSidebar(); renderMain();
  const t = $('[data-k="title"]'); if (t){ t.focus(); t.select(); }
}

async function saveDraft(extra = {}){
  const d = S.draft;
  const fields = d.fields.map(q => ({...q, label:(q.label||"").trim(), options: CHOICE.includes(q.type) ? (q.options||[]).map(o => o.trim()).filter(Boolean) : []}));
  if (!fields.length){ toast("Agrega al menos una pregunta."); return; }
  const empty = fields.find(q => !q.label); if (empty){ toast("Hay una pregunta sin texto."); return; }
  const bad = fields.find(q => CHOICE.includes(q.type) && q.options.length < 2);
  if (bad){ toast(`“${bad.label}” necesita al menos dos opciones.`); return; }
  S.saving = true; renderMain();
  try {
    const { form } = await api("forms", { method:"POST", body: JSON.stringify({ id:d.id, title:d.title, description:d.description, fields, active: extra.active ?? d.active }) });
    const i = S.forms.findIndex(f => f.id === form.id);
    if (i >= 0) S.forms[i] = form; else S.forms.unshift(form);
    S.selected = form.id; S.draft = clone(form); S.saved = clone(form); S.dirty = false;
    toast(d.id ? "Cambios guardados en SharePoint" : "Formulario publicado y lista creada en SharePoint");
    if (!d.id) S.tab = "share";
  } catch (e){ toast(e.message); }
  S.saving = false; renderSidebar(); renderMain();
}

async function toggleActive(){
  const d = S.draft;
  if (d.active){
    if (!confirm(`¿Cerrar “${d.title}”? El QR dejará de aceptar respuestas. Los datos se conservan en SharePoint.`)) return;
    try {
      await api(`forms/${encodeURIComponent(d.id)}`, { method:"DELETE" });
      d.active = false; S.saved.active = false;
      const f = S.forms.find(x => x.id === d.id); if (f) f.active = false;
      toast("Formulario cerrado");
    } catch (e){ toast(e.message); }
    renderSidebar(); renderMain();
  } else {
    await saveDraft({ active:true });
  }
}

function csvFor(f, rs){
  const head = ["Fecha", ...f.fields.map(q => q.label)];
  const rows = rs.map(r => [fmtDate(r.at), ...f.fields.map(q => { const v = r.answers[q.id]; return Array.isArray(v) ? v.join("; ") : (v ?? ""); })]);
  return "\ufeff" + [head, ...rows].map(row => row.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
}
function downloadBlob(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function exportCSV(){
  const d = S.draft;
  if (!S.responses[d.id]) await loadResponses(d.id);
  const rs = (S.responses[d.id] || {}).list || [];
  if (!rs.length){ toast("Aún no hay respuestas para exportar."); return; }
  downloadBlob(new Blob([csvFor(d, rs)], {type:"text/csv;charset=utf-8"}), `${slug(d.title)}-respuestas.csv`);
}

function loadImg(src){ return new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; }); }
async function downloadQR(){
  const d = S.draft, qr = qrMatrix(formLink(d)); if (!qr) return;
  const n = qr.getModuleCount(), cell = 14, m = 4*cell, size = n*cell + 2*m;
  let logo = null; try { logo = await loadImg("/assets/logo-honor.png"); } catch {}
  const logoH = logo ? Math.round((size*0.62) * logo.height / logo.width) : 0, top = logo ? logoH + 50 : 0;
  const c = document.createElement("canvas"); c.width = size; c.height = top + size + 130;
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  if (logo) x.drawImage(logo, size*0.19, 34, size*0.62, logoH);
  x.fillStyle = "#0F1B33";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r,k)) x.fillRect(m + k*cell, top + m + r*cell, cell, cell);
  x.textAlign = "center"; x.fillStyle = "#013FA4"; x.font = '800 34px "Outfit", sans-serif';
  let title = d.title; while (x.measureText(title).width > size - 40 && title.length > 4) title = title.slice(0, -2);
  if (title !== d.title) title = title.trim() + "…";
  x.fillText(title, size/2, top + size + 40);
  x.fillStyle = "#4A5873"; x.font = '500 22px "Outfit", sans-serif';
  x.fillText("Escanea con tu celular para responder", size/2, top + size + 80);
  x.fillStyle = "#013FA4"; x.fillRect(0, c.height - 14, size, 14);
  c.toBlob(b => b && downloadBlob(b, `qr-${slug(d.title)}.png`), "image/png");
}

function openPreview(){
  const dlg = $("#dlg");
  dlg.innerHTML = `<div class="dlg-bar"><b>Vista previa: las respuestas no se guardan</b><button class="btn small" data-act="closepv">Cerrar</button></div>${renderForm(S.draft, {preview:true, submitLabel:"Probar validación"})}`;
  dlg.showModal();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, li = b.closest("[data-i]"), qi = li ? +li.dataset.i : -1;
  switch (act){
    case "reload": return loadForms();
    case "logout": return logout();
    case "new": return newForm();
    case "select": if (b.dataset.id !== S.selected && confirmDiscard()) selectForm(b.dataset.id); return;
    case "tab": S.tab = b.dataset.tab; renderMain(); return;
    case "addq": S.draft.fields.push({id:newId(), label:"", type:"text", required:false, options:[]}); markDirty(); renderMain();
      { const ins = document.querySelectorAll(".q-label"); ins[ins.length-1].focus(); } return;
    case "up": case "down": {
      const fs = S.draft.fields, j = act === "up" ? qi-1 : qi+1;
      if (j < 0 || j >= fs.length) return;
      [fs[qi], fs[j]] = [fs[j], fs[qi]]; markDirty(); renderMain(); return;
    }
    case "delq":
      if (S.saved && S.saved.fields.some(q => q.id === S.draft.fields[qi].id) && !confirm("La columna se conserva en SharePoint con las respuestas anteriores, pero la pregunta deja de mostrarse. ¿Eliminarla?")) return;
      S.draft.fields.splice(qi, 1); markDirty(); renderMain(); return;
    case "save": return saveDraft();
    case "toggle": return toggleActive();
    case "preview": return openPreview();
    case "closepv": $("#dlg").close(); return;
    case "copy": {
      const box = $("#linkbox");
      navigator.clipboard.writeText(box.value).then(() => toast("Enlace copiado")).catch(() => { box.select(); toast("Selecciona el enlace y cópialo"); });
      return;
    }
    case "dlqr": return downloadQR();
    case "csv": return exportCSV();
    case "refresh": return loadResponses(S.draft.id);
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (!S.draft || t.closest("form[data-qrform]")) return;
  if (t.dataset.k){
    S.draft[t.dataset.k] = t.value;
    if (t.dataset.k === "title"){ const h = $("#ftitle"); if (h) h.textContent = t.value || "Formulario sin título"; }
    markDirty();
  } else if (t.dataset.f){
    const q = S.draft.fields[+t.closest("[data-i]").dataset.i], f = t.dataset.f;
    if (f === "label") q.label = t.value;
    else if (f === "options") q.options = t.value.split("\n");
    else if (f === "required") q.required = t.checked;
    else if (f === "type"){
      q.type = t.value;
      if (CHOICE.includes(q.type) && !(q.options||[]).filter(s => s.trim()).length) q.options = ["Opción 1","Opción 2"];
      markDirty(); renderMain(); return;
    }
    markDirty();
  }
});

// Vista previa: valida igual que la página pública, pero no envía nada.
document.addEventListener("submit", e => {
  const formEl = e.target.closest("form[data-qrform]"); if (!formEl) return;
  e.preventDefault();
  const { errors } = collect(formEl, S.draft);
  if (errors.length){ errors[0].scrollIntoView({behavior:"smooth", block:"center"}); return; }
  toast("Todo en orden: así se validará el formulario");
});

window.addEventListener("beforeunload", e => { if (S.dirty){ e.preventDefault(); e.returnValue = ""; } });

init();
</script>
</body>
